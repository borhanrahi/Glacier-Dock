name: Build

# Standard GitHub-hosted runners only (free minutes on public repos).
# No larger/self-hosted runners are configured, so nothing is billed.
#
# Output policy (keeps us inside the free plan):
#   * Tag pushes (v*)  -> installers attached to a GitHub Release. Release
#                         assets are free and do NOT count against Actions
#                         artifact storage.
#   * main / PR pushes -> build validation only, with 3-day artifacts, pruned
#                         to the 2 most recent builds by the cleanup job.
#
# Versioning: automatic. A v* tag sets the app version to the tag (v0.2.0 ->
# 0.2.0); any other run gets 0.1.<run_number>. The version is written into
# package.json, tauri.conf.json and Cargo.toml during CI only — nothing is
# committed back.
#
# Windows note: GitHub only offers Windows Server images, so the Windows 10/11
# installers are produced from windows-latest (Windows 11 kernel family). The
# NSIS/MSI installers target Windows 10 1809+ and Windows 11 alike. Verifying on
# real Win10/Win11 desktops needs a self-hosted runner.
#
# Linux note: ubuntu-22.04 is a standard free runner (not a larger runner). It is
# used instead of ubuntu-latest because it links against glibc 2.35, so the
# AppImage/deb run on Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch and other
# current distros rather than only Ubuntu 24.04+.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the installers"
        type: boolean
        default: true
      version:
        description: "Release version (without the v), e.g. 0.2.0"
        type: string
        required: true

permissions:
  contents: write # required to create the release and upload installers

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Job-level so the matrix context is available; workflow-level concurrency
    # cannot reference matrix and made every run fail at startup.
    #
    # Keyed on the commit SHA (not the ref) so that publishing a release tag for
    # a commit already on main supersedes that commit's validation run instead
    # of building all four OS targets a second time. Commits that are never
    # tagged keep exactly one validation run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.sha }}-${{ matrix.artifact }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64, Win10/11 installer)
            os: windows-latest
            bundles: nsis,msi
            artifact: windows-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundles: app,dmg
            artifact: macos-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            bundles: app,dmg
            artifact: macos-x64
          - name: Linux (x64, deb/rpm/AppImage)
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version '$VERSION' (expected something like 0.2.0)"
            exit 1
          fi
          export VERSION
          node - <<'NODE'
          const fs = require("fs");
          const v = process.env.VERSION;
          for (const p of ["package.json", "src-tauri/tauri.conf.json"]) {
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          }
          const cargo = "src-tauri/Cargo.toml";
          const toml = fs.readFileSync(cargo, "utf8");
          fs.writeFileSync(cargo, toml.replace(/^version = ".*"$/m, `version = "${v}"`));
          console.log(`Glacier Dock version -> ${v}`);
          NODE
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # webkit2gtk 4.1 + libayatana appindicator + rpmbuild for the RPM target.
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      # Release runs: a v* tag push, or a manual dispatch with release=true
      # (which creates the v<version> tag/release from the dispatched commit).
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Glacier Dock v${{ steps.version.outputs.version }}
          releaseBody: |
            Free and open-source liquid glass dock for Windows.

            | Platform | Files |
            | --- | --- |
            | Windows 10/11 (x64) | `.exe` (NSIS installer), `.msi` |
            | macOS Apple Silicon | `.dmg`, `.app` |
            | macOS Intel | `.dmg`, `.app` |
            | Linux | `.AppImage`, `.deb`, `.rpm` |

            Linux packages are built on Ubuntu 22.04 (glibc 2.35): fine on Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch and other current distros.
          releaseDraft: false
          prerelease: false

      # Validation runs only: no release, no tag, nothing published.
      - name: Build and bundle
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundles }}

      # Test builds only. Release assets above never hit artifact storage, and
      # these expire in 3 days so the free 500 MB cap is never reached.
      - name: Upload test bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: glacier-dock-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # Storage guard: after every non-release build, delete artifact sets from all
  # but the 2 most recent builds. Releases are untouchable here — release assets
  # are not Actions artifacts and cost no storage.
  cleanup:
    name: Prune old build artifacts
    needs: build
    if: always() && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # required to delete artifacts
    steps:
      - name: Keep only the 2 most recent builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
                  | select(.name | startswith("glacier-dock-"))
                  | [.created_at, (.workflow_run.id | tostring), (.id | tostring), .name]
                  | @tsv' > artifacts.tsv

          if [[ ! -s artifacts.tsv ]]; then
            echo "No build artifacts found — nothing to prune."
            exit 0
          fi

          sort -r artifacts.tsv > sorted.tsv
          mapfile -t KEEP_RUNS < <(cut -f2 sorted.tsv | awk '!seen[$0]++' | head -n 2)
          echo "Keeping builds: ${KEEP_RUNS[*]}"

          kept() {
            local run_id="$1" r
            for r in "${KEEP_RUNS[@]}"; do
              [[ "$r" == "$run_id" ]] && return 0
            done
            return 1
          }

          while IFS=$'\t' read -r _created run_id artifact_id name; do
            if kept "$run_id"; then
              continue
            fi
            echo "Deleting ${name} (artifact ${artifact_id}, build ${run_id})"
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${artifact_id}" || \
              echo "  warn: could not delete ${artifact_id}"
          done < sorted.tsv

          echo "Prune complete."
