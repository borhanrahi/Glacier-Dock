name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the installers"
        type: boolean
        default: true
      version:
        description: "Release version (without the v), e.g. 0.2.0"
        type: string
        required: false

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            VER="${INPUT_VERSION#v}"
            TAG="v${VER}"
          else
            VER="0.2.$((GITHUB_RUN_NUMBER + 20))"
            TAG="v${VER}"
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version '$VER' (expected something like 0.2.0)"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building Release Version: ${VER} (${TAG})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Glacier Dock ${{ steps.get_version.outputs.tag_name }}
          body: |
            Free and open-source liquid glass dock for Windows.

            | Platform | Files |
            | --- | --- |
            | Windows 10/11 (x64) | `.exe` (NSIS installer), `.msi` |
            | macOS Apple Silicon | `.dmg`, `.app` |
            | macOS Intel | `.dmg`, `.app` |
            | Linux | `.AppImage`, `.deb`, `.rpm` |

            Linux packages are built on Ubuntu 22.04 (glibc 2.35): fine on Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch and other current distros.

            Every asset is listed in a `SHA256SUMS-<platform>.txt` file in the same release so a download can be verified:
            `sha256sum -c SHA256SUMS-windows-x64.txt`.
          draft: false
          prerelease: false

  build:
    name: ${{ matrix.name }}
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.sha }}-${{ matrix.artifact }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64, Win10/11 installer)
            os: windows-latest
            bundles: nsis,msi
            artifact: windows-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundles: app,dmg
            artifact: macos-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            bundles: app,dmg
            artifact: macos-x64
          - name: Linux (x64, deb/rpm/AppImage)
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Apply version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION:-0.2.${GITHUB_RUN_NUMBER}}"
          export VERSION
          node - <<'NODE'
          const fs = require("fs");
          const v = process.env.VERSION;
          for (const p of ["package.json", "src-tauri/tauri.conf.json"]) {
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          }
          const cargo = "src-tauri/Cargo.toml";
          const toml = fs.readFileSync(cargo, "utf8");
          fs.writeFileSync(cargo, toml.replace(/^version = ".*"$/m, `version = "${v}"`));
          console.log(`Glacier Dock version -> ${v}`);
          NODE
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to release
        if: needs.create-release.result == 'success'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: Glacier Dock ${{ needs.create-release.outputs.tag_name }}
          releaseDraft: false
          prerelease: false

      - name: Publish checksums
        if: needs.create-release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          out="$RUNNER_TEMP/SHA256SUMS-${{ matrix.artifact }}.txt"

          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} "$stage"/ \;

          if [[ -z "$(ls -A "$stage")" ]]; then
            echo "No installers were produced — nothing to checksum."
            exit 1
          fi

          cd "$stage"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "$out"
          else
            shasum -a 256 -- * > "$out"
          fi
          cat "$out"
          gh release upload "$TAG" "$out" --repo "${{ github.repository }}" --clobber

      - name: Build and bundle (validation)
        if: needs.create-release.result != 'success'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Upload test bundles
        if: needs.create-release.result != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: glacier-dock-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  cleanup:
    name: Prune old builds & artifacts
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Keep only the 2 most recent builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
                  | select(.name | startswith("glacier-dock-"))
                  | [.created_at, (.workflow_run.id | tostring), (.id | tostring), .name]
                  | @tsv' > artifacts.tsv

          if [[ -s artifacts.tsv ]]; then
            sort -r artifacts.tsv > sorted.tsv
            mapfile -t KEEP_RUNS < <(cut -f2 sorted.tsv | awk '!seen[$0]++' | head -n 2)
            echo "Keeping artifact runs: ${KEEP_RUNS[*]}"

            kept() {
              local run_id="$1" r
              for r in "${KEEP_RUNS[@]}"; do
                [[ "$r" == "$run_id" ]] && return 0
              done
              return 1
            }

            while IFS=$'\t' read -r _created run_id artifact_id name; do
              if kept "$run_id"; then
                continue
              fi
              echo "Deleting ${name} (artifact ${artifact_id}, build ${run_id})"
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${artifact_id}" || \
                echo "  warn: could not delete ${artifact_id}"
            done < sorted.tsv
          fi

          # Keep the 2 most recent v0.2.* auto-releases and prune older ones + tags.
          gh api --paginate "repos/${REPO}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("v0.2.")) | [.created_at, (.id | tostring), .tag_name] | @tsv' \
            > auto_releases.tsv

          if [[ -s auto_releases.tsv ]]; then
            sort -r auto_releases.tsv | tail -n +3 | while IFS=$'\t' read -r _created rel_id tag_name; do
              echo "Deleting old release ${tag_name} (release ${rel_id})"
              gh api -X DELETE "repos/${REPO}/releases/${rel_id}" || \
                echo "  warn: could not delete release ${rel_id}"
              gh api -X DELETE "repos/${REPO}/git/refs/tags/${tag_name}" || \
                echo "  warn: could not delete tag ${tag_name}"
            done
          fi

          echo "Prune complete."
