[package]
name = "glacier-dock"
version = "0.1.0"
description = "Free & open-source Windows smart dock, liquid glass engine and widget host"
authors = ["Glacier Dock contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glacier_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
