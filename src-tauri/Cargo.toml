[package]
name = "glacier-dock"
version = "0.1.0"
description = "Free & open-source Windows smart dock, liquid glass engine and widget host"
authors = ["Glacier Dock contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glacier_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[target."cfg(windows)".dependencies]
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "bmp"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp", "Win32_NetworkManagement_Ndis"] }
